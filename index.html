     for(let k=1;k<run.length;k++){const x0=X(run[k-1].i),y0=Y(run[k-1].r),x1=X(run[k].i),y1=Y(run[k].r),mx=(x0+x1)/2;d+=` C${mx},${y0} ${mx},${y1} ${x1},${y1}`;}
     s+=`<path class="ln" data-th="${id}" d="${d}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" opacity="0.82"/>`;
     s+=`<path class="hit" data-th="${id}" d="${d}" fill="none" stroke="#000" stroke-width="13" stroke-linecap="round" opacity="0"/>`;}
    run.forEach(p=>{s+=`<circle class="dot" data-th="${id}" cx="${X(p.i)}" cy="${Y(p.r)}" r="3.2" fill="${c}"/>`;});});
   const lp=arr[arr.length-1];s+=`<text class="lbl" data-th="${id}" x="${X(lp.i)+9}" y="${Y(lp.r)+4}" font-size="11" fill="${c}" font-weight="600">${esc(t)}</text>`;});
 s+='</svg>';$("bump").innerHTML=s;}
function bumpHi(id){const svg=$("bump").querySelector('svg');if(!svg)return;
 svg.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));
 if(id==null){svg.classList.remove('lo');return;}
 svg.classList.add('lo');svg.querySelectorAll(`[data-th="${id}"]`).forEach(e=>e.classList.add('hot'));}
function renderFlow(){const ym=calYM||(selDate?selDate.slice(0,7):MONTHS[MONTHS.length-1]);
 const [Y,M]=ym.split('-').map(Number);$("flowLabel").textContent=`${Y} 年 ${M} 月`;
 renderBump(ym);renderThemeBoard(ym);}
function renderThemeBoard(ym){const R=10;
 const ds=Object.keys(DLY).filter(d=>d.slice(0,7)===ym).sort();
 const agg={};
 ds.forEach(d=>{(DLY[d].th||[]).slice(0,R).forEach((t,r)=>{const a=agg[t]=agg[t]||{days:0,best:99,score:0};a.days++;a.best=Math.min(a.best,r+1);a.score+=(R+1-(r+1));});});
 const rows=Object.entries(agg).sort((a,b)=>b[1].score-a[1].score||b[1].days-a[1].days).slice(0,20);
 if(!rows.length){$("board").innerHTML='<div class="empty">本月无交易日数据</div>';return;}
 const mx=rows[0][1].score;
 let h='<table class="board-tb"><thead><tr><th>#</th><th>题材</th><th>热度分</th><th>上榜天数</th><th>最佳名次</th></tr></thead><tbody>';
 rows.forEach(([t,a],i)=>{const c=BPAL[i%BPAL.length];
   h+=`<tr><td class="rk">${i+1}</td><td class="tw2"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c};margin-right:7px"></span>${esc(t)}</td>
    <td><span class="bar2" style="width:${Math.max(6,a.score/mx*120)}px;background:${c}"></span> <span class="num" style="color:var(--soft)">${a.score}</span></td>
    <td class="num">${a.days} 天</td><td class="num" style="color:var(--up)">#${a.best}</td></tr>`;});
 h+='</tbody></table>';$("board").innerHTML=h;}

function evRow(r,withCode){const [c,n,t,k,reason]=r;
 return `<div class="evrow"><div class="evhd" onclick="this.parentNode.classList.toggle('open')">
  <span class="badge" style="background:${BADGE[t]||'#6b7280'}">${t}</span><span class="nm">${esc(n)}</span>${withCode?`<span class="cd">${c}</span>`:''}
  <span class="kw">${(k||[]).map(esc).join(' · ')}</span></div><div class="reason">${fmtReason(reason,n,k)}</div></div>`;}

let dayData=null, dayDir='up', dayCache={};
async function ensureDay(ds){if(dayCache[ds])return dayCache[ds];const j=await (await fetch(`days/${ds}.json`)).json();dayCache[ds]=j;return j;}
const dayHead=(ds,o)=>{const [Y,M,Dd]=ds.split('-').map(Number),wk='日一二三四五六'[new Date(Y,M-1,Dd).getDay()];
 return `<div class="pnlhd">${ds} 周${wk}${ds===DATES[0]?'<span class="newbadge">最新增量</span>':''}</div>
  <div class="kpis"><div><b>${o.bn}</b><span>行业板块</span></div><div><b>${o.sn}</b><span>个股异动</span></div><div><b>${o.su}/${o.sdn}</b><span>涨/跌</span></div><div><b>${o.lu}/${o.ld}</b><span>涨停/跌停</span></div></div>`;};
async function openDay(ds){selDate=ds;calYM=ds.slice(0,7);renderCal();
 if(curTab==='blk')await renderDayBlk(ds);else await renderDayStk(ds);}
async function renderDayBlk(ds){const o=DLY[ds];
 $("panel").innerHTML=dayHead(ds,o)+`<div class="seclab">🏭 行业板块 · ${o.bn} 条</div><div id="pBlk"><div class="daycount">加载中…</div></div>`;
 let dd;try{dd=await ensureDay(ds);}catch(e){$("pBlk").innerHTML='<div class="empty">需通过本地服务/线上打开(直接双击 HTML 不行)</div>';return;}
 $("pBlk").innerHTML=dd.b.length?dd.b.map(r=>evRow(r,false)).join(''):'<div class="daycount">当日无行业板块异动</div>';}
async function renderDayStk(ds){const o=DLY[ds];
 $("panel").innerHTML=dayHead(ds,o)+`<div class="seclab">📈 个股 · 先按涨跌,左选题材、右看标的</div>
  <div class="subt"><a id="dUp" class="on">上行 ▲</a><a id="dDn">下行 ▼</a></div>
  <div id="stkInfo" class="daycount" style="margin-bottom:8px">加载中…</div>
  <div class="thlayout"><div id="thCol" class="thcol"></div><div id="thStk" class="thstk"></div></div>`;
 try{dayData=await ensureDay(ds);}
 catch(e){$("stkInfo").textContent='';$("thStk").innerHTML='<div class="empty">需通过本地服务/线上打开(直接双击 HTML 不行)</div>';return;}
 $("dUp").onclick=()=>setDir('up');$("dDn").onclick=()=>setDir('dn');
 setDir('up');}
let dayThemes=[], dayCol='var(--up)', dayArr='▲';
function setDir(d){dayDir=d;
 const up=dayData.s.filter(r=>isUp(r[2])), dn=dayData.s.filter(r=>!isUp(r[2]));
 $("dUp").textContent=`上行 ▲ ${up.length}`;$("dDn").textContent=`下行 ▼ ${dn.length}`;
 $("dUp").classList.toggle('on',d==='up');$("dDn").classList.toggle('on',d==='dn');
 const rows=d==='up'?up:dn; dayCol=d==='up'?'var(--up)':'var(--dn)'; dayArr=d==='up'?'▲':'▼';
 const g={};rows.forEach(r=>{const t=r[5]||'其他';(g[t]=g[t]||[]).push(r);});
 let multi=[],solo=[];
 Object.entries(g).forEach(([t,rs])=>{ if(t!=='其他'&&rs.length>=2) multi.push([t,rs]); else solo.push(...rs); });
 multi.sort((a,b)=>b[1].length-a[1].length);
 if(solo.length) multi.push(['其他 · 零散单票',solo]);
 dayThemes=multi;
 if(!rows.length){$("stkInfo").textContent='';$("thCol").innerHTML='';$("thStk").innerHTML='<div class="empty">当日无</div>';return;}
 $("stkInfo").textContent=`${multi.filter(m=>m[0]!=='其他 · 零散单票').length} 个聚合题材(≥2只)${solo.length?` + 其他 ${solo.length} 只`:''} · 点左侧题材看旗下标的`;
 $("thCol").innerHTML=multi.map(([th,rs],i)=>`<div class="thitem" data-i="${i}"><span class="tn">${esc(th)}</span><span class="tcq" style="color:${dayCol}">${dayArr} ${rs.length}</span></div>`).join('');
 $("thCol").querySelectorAll('.thitem').forEach(el=>el.onclick=()=>selTheme(+el.dataset.i));
 selTheme(0);}
function selTheme(i){
 $("thCol").querySelectorAll('.thitem').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
 const [th,rs]=dayThemes[i];
 $("thStk").innerHTML=`<div class="thstk-hd">${esc(th)}<small>${rs.length} 只 · ${dayArr}</small></div>`+rs.map(r=>evRow(r,true)).join('');}

/* 标的 */
let scur=null;
function entInit(){srender();$("q").oninput=srender;$("stype").onchange=srender;
 $("list").addEventListener('click',e=>{const r=e.target.closest('.srow[data-c]');if(r)openStock(r.dataset.c);});}
function srender(){const q=$("q").value.trim().toLowerCase(),ty=$("stype").value;
 let rows=IDX.filter(r=>{if(ty&&r.dim!==ty)return false;if(!q)return true;return r.c.includes(q)||r.n.toLowerCase().includes(q)||(r.th||[]).some(t=>t.toLowerCase().includes(q));});
 $("list").innerHTML='<div class="srow" style="font-size:10px;color:var(--muted);text-transform:uppercase;position:sticky;top:0;background:var(--panel);z-index:1"><span>代码</span><span>名称 / 题材</span><span>异动</span><span>涨停</span></div>'+
  rows.slice(0,1500).map(r=>`<div class="srow${scur===r.c?' on':''}" data-c="${r.c}"><span>${r.c}</span>
   <span><span class="nm"><b>${esc(r.n)}</b><span class="mk">${r.m}</span></span><div class="th2">${(r.th||[]).map(esc).join(' · ')||'—'}</div></span>
   <span>${r.x}</span><span class="up">${r.lu||''}</span></div>`).join('')+(rows.length>1500?'<div class="daycount" style="padding:10px;text-align:center">仅显示前 1500,请搜索缩小</div>':'');}
async function openStock(code){scur=code;srender();const info=IDX.find(r=>r.c===code);
 $("panel").innerHTML='<div class="empty">加载中…</div>';
 let rs;try{rs=await (await fetch(`recs/${code}.json`)).json();}catch(e){$("panel").innerHTML='<div class="empty">加载失败</div>';return;}
 const tl=rs.map(r=>`<div class="evrow"><div class="evhd" onclick="this.parentNode.classList.toggle('open')">
   <span class="num" style="font-size:12px;color:var(--soft)">${r.d}</span><span class="badge" style="background:${BADGE[r.t]||'#6b7280'}">${r.t}</span>
   <span class="kw">${(r.k||[]).map(esc).join(' · ')}</span></div><div class="reason">${fmtReason(r.r,info.n,r.k)}</div></div>`).join('');
 $("panel").innerHTML=`<div class="pnlhd">${esc(info.n)} <span class="mk">${info.m}</span> <span class="cd num" style="font-size:13px;color:var(--muted)">${code}</span></div>
   <div class="daycount">全年 ${rs.length} 次 · 大涨${info.up}/涨停${info.lu}/大跌${info.dn}/跌停${info.ld} · 点开看完整正文</div>${tl}`;}

$("calPrev").onclick=()=>{const i=MONTHS.indexOf(calYM);if(i>0){calYM=MONTHS[i-1];renderCal();}};
$("calNext").onclick=()=>{const i=MONTHS.indexOf(calYM);if(i<MONTHS.length-1){calYM=MONTHS[i+1];renderCal();}};
$("calGrid").addEventListener('click',e=>{const c=e.target.closest('.cell.has');if(c)openDay(c.dataset.d);});
$("bump").addEventListener('mouseover',e=>{const el=e.target.closest('[data-th]');bumpHi(el?el.dataset.th:null);});
$("bump").addEventListener('mouseleave',()=>bumpHi(null));
selDate=DATES[0];calYM=DATES[0].slice(0,7);
nav('blk');
</script></body></html>
